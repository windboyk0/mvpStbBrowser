<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메인 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--bg:#0E0B20;--surface:#1B1830;--surface2:#25223D;--border:#3A3754;--primary:#3D2BD9;--focus:#6E74FF;--t1:#fff;--t2:#B5B3C9;--t3:#77758C;--danger:#FF4D5E}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t1);font-family:Pretendard,"Malgun Gothic",sans-serif;min-width:1280px}
button{font:inherit;color:inherit;cursor:pointer}
.top{height:56px;display:flex;align-items:center;gap:12px;padding:0 28px;border-bottom:1px solid #1F1C36}
.top h1{font-size:18px;font-weight:600;margin:0;flex:1}
.back{background:none;border:0;font-size:22px;color:var(--t2);padding:4px}
main{padding:28px 40px;max-width:1600px;margin:0 auto}
.sec{font-size:26px;font-weight:600;margin:10px 0 18px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.card{position:relative;background:var(--surface);border:2px solid var(--border);border-radius:10px;padding:18px 18px 16px;min-height:118px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;transition:.12s}
.card:hover{border-color:var(--focus);background:var(--surface2)}
.card.buy{border-color:#4A3FB5}
.card.buy:hover{border-color:var(--focus)}
.card .t{font-size:19px;font-weight:600;display:flex;gap:10px;align-items:center}
.card .t i{font-size:26px;color:var(--t2)}
.card .s{font-size:17px;color:var(--t2);display:flex;justify-content:flex-end;align-items:center}
.new{position:absolute;top:10px;right:12px;font-size:11px;background:var(--primary);border-radius:999px;padding:2px 8px}
.ph{color:var(--t3);text-align:center;padding:120px 0;font-size:16px}
</style>
</head>
<body>
<header class="top">
  <button class="back" id="back" aria-label="뒤로"><i class="ti ti-arrow-left"></i></button>
  <h1 id="title"></h1>
</header>
<main id="app"></main>

<script>
const MENUS=[
 {key:'singlePurchase',label:'단건구매',icon:'shopping-cart',isNew:true},
 {key:'monthlyPurchase',label:'월정액구매',icon:'calendar-repeat',isNew:true},
 {key:'coupon',label:'쿠폰함',icon:'ticket'},
 {key:'bCash',label:'B 캐시',icon:'coin'},
 {key:'monthlyPurchaseInfo',label:'나의 이용권',icon:'id-badge-2'},
 {key:'singlePurchaseInfo',label:'구매내역',icon:'receipt'},
 {key:'plan',label:'나의 요금상품',icon:'barcode'},
 {key:'tvPoint',label:'TV 포인트',icon:'device-tv'},
 {key:'tMembership',label:'T 멤버십',icon:'letter-t'},
 {key:'okCashbag',label:'OK캐쉬백',icon:'cash'},
 {key:'settings',label:'설정',icon:'settings'}];
const $=id=>document.getElementById(id);
let route=null;
function go(key){route=key;render()}
function render(){
  const m=MENUS.find(x=>x.key===route);
  $('back').style.visibility=m?'visible':'hidden';
  if(m){$('title').textContent=m.label;$('app').innerHTML=`<div class="ph">${m.label} 화면은 별도 spec에서 정의됩니다.</div>`;return}
  $('title').textContent='MY B tv 구매 테스트';
  $('app').innerHTML=`<div class="sec">MY B tv</div><div class="grid">${MENUS.map(m=>`<button class="card ${m.isNew?'buy':''}" onclick="go('${m.key}')">${m.isNew?'<span class="new">신규</span>':''}<div class="t"><i class="ti ti-${m.icon}"></i>${m.label}</div><div class="s"><i class="ti ti-chevron-right"></i></div></button>`).join('')}</div>`;
}
$('back').onclick=()=>go(null);
render();
</script>
</body>
</html>
